name: Bug report
description: Something in email-lens doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, and a minimal HTML snippet if the problem is about a specific email.
      render: html
  - type: input
    id: version
    attributes:
      label: Version and how you run it
      placeholder: "0.1.0 via npx / Docker / source, Node 22, macOS"
